<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarea</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f5f5f5;
display:flex;
color:#111827;
}

/* SIDEBAR */

.sidebar{
width:240px;
background:white;
height:100vh;
padding:20px;
display:flex;
flex-direction:column;
justify-content:space-between;
border-right:1px solid #e5e7eb;
position:fixed;
left:0;
top:0;
}

.logo{
display:flex;
gap:10px;
align-items:center;
margin-bottom:20px;
padding-bottom:10px;
border-bottom:1px solid #eee;
}

.logo-icon{
font-size:32px;
}

.logo-text{
display:flex;
flex-direction:column;
line-height:1.1;
}

.logo-text b{
font-size:20px;
}

.logo-text span{
font-size:14px;
color:#64748b;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu a{
text-decoration:none;
color:#64748b;
padding:10px;
border-radius:8px;
display:flex;
gap:10px;
align-items:center;
transition:0.2s;
}

.menu a:hover{
background:#e0e7ff;
color:#2563eb;
}

.menu .active{
background:#e0e7ff;
color:#2563eb;
}

/* MOBILE */

.menu-btn{
display:none;
font-size:24px;
cursor:pointer;
}

.sidebar-mobile{
position:fixed;
left:-260px;
top:0;
width:240px;
height:100%;
background:white;
padding:20px;
transition:0.3s;
z-index:1000;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.sidebar-mobile.active{
left:0;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.3);
display:none;
z-index:999;
}

.overlay.active{
display:block;
}

/* MAIN */

.main{
margin-left:240px;
flex:1;
padding:30px;
}

.top{
display:flex;
align-items:center;
gap:14px;
margin-bottom:30px;
}

.back-btn{
width:42px;
height:42px;
background:white;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
text-decoration:none;
color:black;
border:1px solid #e5e7eb;
}

.title h1{
font-size:36px;
margin-bottom:5px;
}

.title p{
color:#6b7280;
}

/* BOX */

.task-box{
background:white;
padding:30px;
border-radius:24px;
border:1px solid #e5e7eb;
}

.task-box h2{
font-size:32px;
margin-bottom:15px;
}

.task-box p{
font-size:16px;
color:#4b5563;
line-height:1.7;
margin-bottom:25px;
}

.info{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:25px;
}

.badge{
padding:10px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
}

.high{
background:#fee2e2;
color:#dc2626;
}

.medium{
background:#ffedd5;
color:#ea580c;
}

.low{
background:#dcfce7;
color:#16a34a;
}

.submit-box{
margin-top:30px;
padding:25px;
background:#f8fafc;
border-radius:20px;
border:1px dashed #cbd5e1;
}

.submit-box h3{
margin-bottom:15px;
}

.submit-box input{
margin-bottom:15px;
}

.submit-box button{
background:#2563eb;
color:white;
border:none;
padding:14px 18px;
border-radius:14px;
font-weight:600;
cursor:pointer;
font-family:'Poppins',sans-serif;
}

/* RESPONSIVE */

@media(max-width:900px){

.sidebar{
display:none;
}

.menu-btn{
display:block;
}

.main{
margin-left:0;
padding:20px;
}

.title h1{
font-size:28px;
}

.task-box h2{
font-size:26px;
}

}

</style>
</head>

<body>


<div class="sidebar-mobile" id="mobileMenu">

<div>

<div class="logo">
<div class="logo-icon">📘</div>

<div class="logo-text">
<b>Agenda</b>
<span>Estudiantil</span>
</div>

</div>

<div class="menu">
<a href="/dashboard">Dashboard</a>
<a href="/courses">Cursos</a>
<a class="active" href="/tasks">Tareas</a>
<a>Recordatorios</a>
<a href="/study">Estudio</a>
<a href="/profile">Mi Perfil</a>
</div>

</div>

</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>


<div class="sidebar">

<div>

<div class="logo">
<div class="logo-icon">📘</div>

<div class="logo-text">
<b>Agenda</b>
<span>Estudiantil</span>
</div>

</div>

<div class="menu">
<a href="/dashboard">Dashboard</a>
<a href="/courses">Cursos</a>
<a class="active" href="/tasks">Tareas</a>
<a>Recordatorios</a>
<a href="/study">Estudio</a>
<a href="/profile">Mi Perfil</a>
</div>

</div>

</div>


<div class="main">

<div class="top">

<a href="/courses" class="back-btn">
‹
</a>

<div class="menu-btn" onclick="toggleMenu()">
☰
</div>

<div class="title">

<h1>
Detalle de tarea
</h1>

<p>
Visualiza la actividad completa
</p>

</div>

</div>

<div class="task-box">

<h2 th:text="${task.title}">
Título
</h2>

<p th:text="${task.description}">
Descripción
</p>

<div class="info">

<div class="badge"
th:classappend="${task.priority == 'ALTA'} ? ' high' :
(${task.priority == 'MEDIA'} ? ' medium' : ' low')">

<span th:text="${task.priority}">
PRIORIDAD
</span>

</div>

<div class="badge">
🕒
<span th:text="${task.dueDate}"></span>
</div>

</div>

<div class="submit-box"
th:if="${session.user.role == 'ALUMNO'}">

<h3>
📤 Entregar tarea
</h3>

<form method="post"
enctype="multipart/form-data">

<input type="file"
name="file"
required>

<br>

<button type="submit">
Subir archivo
</button>

</form>

</div>

</div>

</div>

<script>

function toggleMenu(){

document.getElementById("mobileMenu").classList.toggle("active");

document.getElementById("overlay").classList.toggle("active");

}

</script>

</body>
</html>
