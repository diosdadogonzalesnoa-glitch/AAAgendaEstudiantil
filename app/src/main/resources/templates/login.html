<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #0f172a;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 14px;
        }

        input {
            border: none;
            outline: none;
        }

        button {
            background: #22c55e;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .error {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .success {
            color: #22c55e;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .link {
            text-align: center;
            font-size: 14px;
        }

        .link a {
            color: #38bdf8;
            text-decoration: none;
        }

        .roles {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .role-box {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            background: #1e293b;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .role-box.active {
            border: 2px solid #22c55e;
            background: #334155;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Iniciar Sesión</h2>

    <div class="success" th:if="${msg != null and msg.contains('Registro exitoso')}" th:text="${msg}"></div>
    <div class="error" id="msg" th:if="${msg != null and !msg.contains('Registro exitoso')}" th:text="${msg}"></div>

    <div class="roles">
        <div class="role-box" onclick="selectRole('ESTUDIANTE', this)">
            🎓<br>Alumno
        </div>

        <div class="role-box" onclick="selectRole('DOCENTE', this)">
            👨‍🏫<br>Docente
        </div>
    </div>

    <form action="/login" method="post" onsubmit="return validar()">

        <input type="hidden" id="role">

        <input type="email" name="email" id="email" placeholder="Correo" required>

        <input type="password" name="password" placeholder="Contraseña" required>

        <button type="submit">Ingresar</button>
    </form>

    <div class="link">
        <a href="/register">¿No tienes cuenta? Regístrate</a>
    </div>
</div>

<script>
let selectedRole = "";

function selectRole(role, element) {

    selectedRole = role;

    document.querySelectorAll(".role-box").forEach(e => e.classList.remove("active"));
    element.classList.add("active");
}

function validar() {

    let email = document.getElementById("email").value;

    if (!selectedRole) {
        alert("Selecciona un rol");
        return false;
    }

    if (selectedRole === "ESTUDIANTE" && !email.startsWith("U")) {
        alert("Debes usar un correo de estudiante (U...)");
        return false;
    }

    if (selectedRole === "DOCENTE" && !email.startsWith("C")) {
        alert("Debes usar un correo de docente (C...)");
        return false;
    }

    return true;
}

let msg = document.getElementById("msg");

if (msg && msg.innerText.includes("Cuenta bloqueada")) {

    let match = msg.innerText.match(/\d+/);

    if (match) {
        let segundos = parseInt(match[0]);

        let intervalo = setInterval(() => {
            segundos--;

            if (segundos > 0) {
                msg.innerText = "Cuenta bloqueada (" + segundos + "s)";
            } else {
                msg.innerText = "Puedes intentar nuevamente";
                clearInterval(intervalo);
            }
        }, 1000);
    }
}
</script>

</body>
</html>
