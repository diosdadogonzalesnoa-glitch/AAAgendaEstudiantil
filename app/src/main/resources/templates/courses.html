<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#f1f5f9;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:white;
height:100vh;
padding:20px;
display:flex;
flex-direction:column;
justify-content:space-between;
border-right:1px solid #e5e7eb;
}

.logo{
display:flex;
gap:10px;
align-items:center;
margin-bottom:20px;
padding-bottom:10px;
border-bottom:1px solid #eee;
}

.logo-icon{
font-size:32px;
}

.logo-text{
display:flex;
flex-direction:column;
line-height:1.1;
}

.logo-text b{
font-size:20px;
}

.logo-text span{
font-size:14px;
color:#64748b;
}

/* MENU */
.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu a{
text-decoration:none;
color:#64748b;
padding:10px;
border-radius:8px;
display:flex;
gap:10px;
align-items:center;
}

.menu a:hover{
background:#e0e7ff;
color:#2563eb;
}

.menu .active{
background:#e0e7ff;
color:#2563eb;
}

/* USER */
.user{
margin-top:30px;
border-top:1px solid #eee;
padding-top:15px;
display:flex;
align-items:center;
gap:10px;
}

.user-icon{
font-size:28px;
}

.user-info{
display:flex;
flex-direction:column;
}

.user-info b{
font-size:14px;
}

.user-info span{
font-size:12px;
color:#64748b;
}

.logout{
color:#ef4444;
text-decoration:none;
display:block;
margin-top:10px;
}

/* MAIN */
.main{
flex:1;
padding:25px;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.add-btn{
background:#2563eb;
color:white;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

/* FORM */
.form{
display:none;
margin-bottom:20px;
}

.form input{
padding:10px;
margin:5px;
border-radius:8px;
border:1px solid #ccc;
}

.form button{
background:#22c55e;
color:white;
border:none;
padding:10px;
border-radius:8px;
}

/* GRID */
.courses-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

/* CARD */
.course-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.course-card h3{
margin-bottom:10px;
}

.course-card p{
color:#64748b;
}

/* MOBILE */
.menu-btn{
display:none;
font-size:22px;
cursor:pointer;
}

/* SIDEBAR MOBILE */
.sidebar-mobile{
position:fixed;
left:-260px;
top:0;
width:240px;
height:100%;
background:white;
padding:20px;
transition:0.3s;
z-index:1000;
}

.sidebar-mobile.active{
left:0;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.3);
display:none;
}

.overlay.active{
display:block;
}

/* RESPONSIVE */
@media(max-width:900px){

.sidebar{
display:none;
}

.menu-btn{
display:block;
}

}
</style>
</head>

<body>

<!-- SIDEBAR MOBILE -->
<div class="sidebar-mobile" id="mobileMenu">

<div class="logo">
<div class="logo-icon">📘</div>
<div class="logo-text">
<b>Agenda</b>
<span>Estudiantil</span>
</div>
</div>

<div class="menu">
<a href="/dashboard">Dashboard</a>
<a class="active" href="/courses">Cursos</a>
<a>Tareas</a>
<a>Recordatorios</a>
<a>Estudio</a>

<!-- 🔥 AQUÍ ESTABA EL ERROR -->
<a href="/profile">Mi Perfil</a>

</div>

<a href="/logout" class="logout">Cerrar sesión</a>

</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- SIDEBAR DESKTOP -->
<div class="sidebar">

<div>

<div class="logo">
<div class="logo-icon">📘</div>
<div class="logo-text">
<b>Agenda</b>
<span>Estudiantil</span>
</div>
</div>

<div class="menu">
<a href="/dashboard">Dashboard</a>
<a class="active" href="/courses">Cursos</a>
<a>Tareas</a>
<a>Recordatorios</a>
<a>Estudio</a>
<a href="/profile">Mi Perfil</a>
</div>

</div>

<div>
<div class="user">
<div class="user-icon">👤</div>
<div class="user-info">
<b th:text="${nombre}"></b>
<span>Estudiante</span>
</div>
</div>

<a href="/logout" class="logout">Cerrar sesión</a>
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="header">
<div style="display:flex;align-items:center;gap:10px;">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<h2>Cursos</h2>
</div>

<button class="add-btn" onclick="toggleForm()">+ Añadir</button>
</div>

<div class="form" id="form">
<form action="/courses/add" method="post">
<input type="text" name="name" placeholder="Nombre del curso" required>
<input type="text" name="teacher" placeholder="Profesor" required>
<input type="text" name="schedule" placeholder="Horario" required>

<button type="submit">Guardar</button>
</form>
</div>

<div class="courses-container">

<div class="course-card" th:each="c : ${courses}">
<h3 th:text="${c.name}"></h3>
<p th:text="${c.teacher}"></p>
<p th:text="${c.schedule}"></p>
</div>

</div>

</div>

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
document.getElementById("overlay").classList.toggle("active");
}

function toggleForm(){
let form=document.getElementById("form");
form.style.display=form.style.display==="none"?"block":"none";
}
</script>

</body>
</html>
