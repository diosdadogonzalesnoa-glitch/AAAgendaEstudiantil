<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#f1f5f9;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:white;
height:100vh;
padding:20px;
display:flex;
flex-direction:column;
justify-content:space-between;
border-right:1px solid #e5e7eb;
}

/* MOBILE SIDEBAR */
.sidebar-mobile{
position:fixed;
left:-260px;
top:0;
width:240px;
height:100%;
background:white;
padding:20px;
transition:0.3s;
z-index:1000;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.sidebar-mobile.active{
left:0;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.3);
display:none;
}

.overlay.active{
display:block;
}

.menu-btn{
display:none;
font-size:22px;
cursor:pointer;
}

/* LOGO */
.logo{
display:flex;
gap:10px;
align-items:center;
margin-bottom:20px;
padding-bottom:10px;
border-bottom:1px solid #eee;
}

.logo-icon{font-size:32px;}

.logo-text{
display:flex;
flex-direction:column;
line-height:1.1;
}

.logo-text b{font-size:20px;}
.logo-text span{font-size:14px;color:#64748b;}

/* MENU */
.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu a{
text-decoration:none;
color:#64748b;
padding:10px;
border-radius:8px;
display:flex;
gap:10px;
align-items:center;
}

.menu a:hover{background:#e0e7ff;color:#2563eb;}
.menu .active{background:#e0e7ff;color:#2563eb;}

/* USER */
.user{
margin-top:30px;
border-top:1px solid #eee;
padding-top:15px;
display:flex;
gap:10px;
}

.user-icon{font-size:28px;}

.user-info{
display:flex;
flex-direction:column;
}

.user-info b{font-size:14px;}
.user-info span{font-size:12px;color:#64748b;}

.logout{
color:#ef4444;
text-decoration:none;
display:block;
margin-top:10px;
}

/* MAIN */
.main{
flex:1;
padding:25px;
}

.title{
font-size:24px;
font-weight:600;
}

.subtitle{
color:#64748b;
margin-bottom:20px;
}

/* GRID */
.top{
display:grid;
grid-template-columns:350px 1fr;
gap:20px;
margin-bottom:20px;
}

/* PROFILE CARD */
.profile-card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.center{text-align:center;}

.avatar{
width:90px;
height:90px;
border-radius:50%;
background:linear-gradient(135deg,#6366f1,#9333ea);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:34px;
margin:0 auto 10px auto;
}

.edit{
cursor:pointer;
margin-left:5px;
}

/* INFO BOX */
.info-box{
background:#f8fafc;
border-radius:12px;
padding:12px 15px;
display:flex;
justify-content:space-between;
align-items:center;
margin-top:12px;
}

.label{font-size:14px;color:#64748b;}
.value{font-weight:600;}
.icon{font-size:20px;}

/* FORM */
.form{display:none;margin-top:15px;}

.form input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

.btn-group{
display:flex;
gap:10px;
}

.save{
flex:1;
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
}

.cancel{
width:60px;
background:#e5e7eb;
border:none;
border-radius:10px;
cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:900px){
.sidebar{display:none;}
.menu-btn{display:block;}
.top{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<!-- SIDEBAR MOBILE -->
<div class="sidebar-mobile" id="mobileMenu">

<div>

<div class="logo">
<div class="logo-icon">📘</div>
<div class="logo-text">
<b>Agenda</b>
<span>Estudiantil</span>
</div>
</div>

<div class="menu">
<a href="/dashboard">Dashboard</a>
<a href="/courses">Cursos</a>
<a href="/tasks">Tareas</a>
<a href="/reminders">Recordatorios</a>
<a href="/study">Estudio</a>
<a class="active" href="/profile">Mi Perfil</a>
</div>

</div>

<div>
<div class="user">
<div class="user-icon">👤</div>
<div class="user-info">
<b th:text="${nombre}"></b>
<span th:text="${session.user.role == 'DOCENTE' ? 'Docente' : 'Estudiante'}"></span>
</div>
</div>

<a href="/logout" class="logout">Cerrar sesión</a>
</div>

</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- SIDEBAR DESKTOP -->
<div class="sidebar">

<div>
<div class="logo">
<div class="logo-icon">📘</div>
<div class="logo-text">
<b>Agenda</b>
<span>Estudiantil</span>
</div>
</div>

<div class="menu">
<a href="/dashboard">Dashboard</a>
<a href="/courses">Cursos</a>
<a href="/tasks">Tareas</a>
<a href="/reminders">Recordatorios</a>
<a href="/study">Estudio</a>
<a class="active" href="/profile">Mi Perfil</a>
</div>
</div>

<div>
<div class="user">
<div class="user-icon">👤</div>
<div class="user-info">
<b th:text="${nombre}"></b>
<span th:text="${session.user.role == 'DOCENTE' ? 'Docente' : 'Estudiante'}"></span>
</div>
</div>

<a href="/logout" class="logout">Cerrar sesión</a>
</div>

</div>

<div class="main">

<div style="display:flex;align-items:center;gap:10px;margin-bottom:15px;">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div>
<div class="title">Mi Perfil</div>
<div class="subtitle">Información personal y rendimiento académico</div>
</div>
</div>

<div class="top">

<div class="profile-card">

<div class="center">

<div class="avatar">
<span th:text="${nombre != null ? nombre.substring(0,1) : 'U'}"></span>
</div>

<h3>
<span th:text="${nombre}"></span>
<span class="edit" onclick="toggleEdit()">✏️</span>
</h3>

<p style="color:#64748b;"
   th:text="${session.user.role == 'DOCENTE' ? 'Docente' : 'Estudiante'}">
</p>

</div>

<div class="info-box">
<div>
<div class="label">Email</div>
<div class="value" th:text="${email}"></div>
</div>
<div class="icon">📧</div>
</div>

<div class="info-box">
<div>
<div class="label">Rol</div>
<div class="value"
     th:text="${session.user.role == 'DOCENTE' ? 'Docente' : 'Estudiante'}">
</div>
</div>
<div class="icon">👤</div>
</div>

<div class="info-box">
<div>
<div class="label">Cursos activos</div>
<div class="value">2 cursos</div>
</div>
<div class="icon">📖</div>
</div>

<div class="form" id="editForm">
<form action="/profile/update" method="post">

<input type="text" name="name" placeholder="Nuevo nombre" required>
<input type="hidden" name="email" th:value="${email}">

<div class="btn-group">
<button class="save">Guardar</button>
<button type="button" class="cancel" onclick="toggleEdit()">X</button>
</div>

</form>
</div>

</div>

</div>

</div>

</div>

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
document.getElementById("overlay").classList.toggle("active");
}

function toggleEdit(){
let form=document.getElementById("editForm");
form.style.display=form.style.display==="none"?"block":"none";
}
</script>

</body>
</html>
