<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 14px;
        }

        input {
            border: none;
            outline: none;
        }

        button {
            background: #3b82f6;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .link {
            text-align: center;
            font-size: 14px;
        }

        .link a {
            color: #3b82f6;
            text-decoration: none;
        }

        .roles {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .role-box {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            background: #334155;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .role-box.active {
            border: 2px solid #22c55e;
            background: #475569;
        }

        .error {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Registro</h2>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <div class="roles">
        <div class="role-box" onclick="selectRole('ESTUDIANTE', this)">
            🎓<br>Alumno
        </div>

        <div class="role-box" onclick="selectRole('DOCENTE', this)">
            👨‍🏫<br>Docente
        </div>
    </div>

    <form action="/register" method="post" onsubmit="return validar()">

        <input type="hidden" name="role" id="role">

        <input type="text" name="name" placeholder="Nombre" required>

        <input type="email" name="email" id="email" placeholder="Correo" required>

        <input type="password" name="password" placeholder="Contraseña" required>

        <button type="submit">Registrar</button>
    </form>

    <div class="link">
        <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>

<script>
let selectedRole = "";

function selectRole(role, element) {

    selectedRole = role;
    document.getElementById("role").value = role;

    document.querySelectorAll(".role-box").forEach(e => e.classList.remove("active"));
    element.classList.add("active");
}

function validar() {

    let email = document.getElementById("email").value;

    if (!selectedRole) {
        alert("Selecciona un rol");
        return false;
    }

    if (selectedRole === "ESTUDIANTE" && !email.startsWith("U")) {
        alert("El correo de estudiante debe iniciar con U");
        return false;
    }

    if (selectedRole === "DOCENTE" && !email.startsWith("C")) {
        alert("El correo de docente debe iniciar con C");
        return false;
    }

    return true;
}
</script>

</body>
</html>
